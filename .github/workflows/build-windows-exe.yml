name: build-windows-exe

"on":
  workflow_dispatch:
  push:
    branches:
      - main
    tags:
      - "v*"

jobs:
  build:
    name: Build Windows EXE
    runs-on: windows-2022

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup MSVC
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64

      - name: Setup CMake
        uses: lukka/get-cmake@latest

      - name: Bootstrap vcpkg
        shell: cmd
        run: |
          if not exist third_party\vcpkg\vcpkg.exe (
            git clone https://github.com/microsoft/vcpkg third_party\vcpkg
            call third_party\vcpkg\bootstrap-vcpkg.bat -disableMetrics
          )

      - name: Configure
        shell: cmd
        run: |
          cmake -S . -B build -G "Visual Studio 17 2022" -A x64 ^
            -DCMAKE_TOOLCHAIN_FILE="%CD%\third_party\vcpkg\scripts\buildsystems\vcpkg.cmake" ^
            -DVCPKG_TARGET_TRIPLET=x64-windows-static ^
            -DAO_BAKER_STATIC_RUNTIME=ON

      - name: Build
        shell: cmd
        run: |
          cmake --build build --config Release --parallel

      - name: Collect artifact
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force dist | Out-Null
          Copy-Item build\Release\AO_Baker_Pro_Standalone.exe dist\AO_Baker_Pro_Standalone.exe -Force
          Compress-Archive -Path dist\AO_Baker_Pro_Standalone.exe -DestinationPath dist\AO_Baker_Pro_Standalone_Windows.zip -Force

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: AO_Baker_Pro_Standalone_Windows
          path: |
            dist/AO_Baker_Pro_Standalone.exe
            dist/AO_Baker_Pro_Standalone_Windows.zip
